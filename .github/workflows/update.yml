name: Mise à jour des incidents

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths-ignore: ["veille-france/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: veille-france
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rangement des fichiers envoyés au mauvais endroit
        run: |
          mkdir -p scripts
          for f in *.mjs; do
            [ -e "$f" ] || continue
            case "$f" in
              *_[0-9]*.mjs) git rm -q -f "$f" ;;
              *) git mv -f "$f" "scripts/$f" ;;
            esac
          done
          for f in index_*.html; do [ -e "$f" ] && git rm -q -f "$f"; done
          printf 'node_modules/\n_site/\n' > .gitignore
          ls scripts

      - run: npm install --no-audit --no-fund

      - name: Lecture des flux, regroupement et alertes
        run: node scripts/update.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}

      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Incidents $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Enregistrement impossible cette fois, la carte est quand même publiée."

      - name: Préparation du site
        run: |
          mkdir -p _site/data
          cp index.html departements.json _site/
          cp data/data.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: veille-france/_site
      - id: deploy
        uses: actions/deploy-pages@v4
